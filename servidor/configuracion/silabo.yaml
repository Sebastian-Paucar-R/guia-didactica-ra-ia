# Sílabo de la asignatura Normativas de Ingeniería de Software (0611ANIS7UP-AJ2025).
#
# Fuente de verdad del temario para el tutor: el filtro de pertinencia clasifica contra este archivo
# (no contra listas escritas en los prompts), la auditoría de cobertura (pruebas/auditar_cobertura.py)
# lo cruza con los documentos indexados y las redirecciones proponen temas tomados de aquí.
#
# Cada tema tiene:
#   id            "<unidad>.<n>", único.
#   nombre        cómo se le presenta al estudiante y al LLM.
#   unidad        número de unidad (1-4).
#   palabras_clave  términos que delatan el tema en una pregunta. Se comparan sin acentos ni mayúsculas y
#                 por palabra completa; un `*` al final de una palabra admite cualquier terminación
#                 ("certific*" -> certificación, certificar, certificado). Deben ser específicos: una palabra
#                 corriente ("calidad", "prueba", "riesgo") atraería preguntas de otras materias.
#                 Un prefijo `~` la marca como débil: solo decide si ninguna palabra fuerte de ningún tema
#                 aparece (sirve para pistas genéricas como "norma ISO", que no bastan para elegir tema).
#                 Los números de norma ("29119") pesan más que las frases: son lo más específico.
#   archivos      documentos de documentacion/markdown/ que respaldan el tema; [] si no hay ninguno.
#                 La auditoría comprueba que estén indexados y que de verdad traten el tema.

