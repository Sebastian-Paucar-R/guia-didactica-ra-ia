<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor IA - Guía Didáctica RA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(15, 23, 42, 0.95);
            padding: 1rem 2rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.35rem; font-weight: 700; color: #38bdf8; }
        .status {
            background: #065f46;
            color: #6ee7b7;
            padding: 0.35rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .status::before {
            content: '';
            width: 8px; height: 8px;
            background: #34d399;
            border-radius: 50%;
        }
        .container {
            display: grid;
            grid-template-columns: 340px 1fr 280px;
            gap: 1.2rem;
            padding: 1.2rem;
            flex: 1;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }
        .panel {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            padding: 1.2rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .panel h2 {
            font-size: 0.95rem;
            margin-bottom: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .panel h2.sub { margin-top: 1.2rem; }
        .panel-docs { overflow-y: auto; }
        .doc-list { list-style: none; overflow-y: auto; flex: 1; min-height: 60px; max-height: 260px; }
        .doc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.55rem 0.7rem;
            background: #0f172a;
            margin-bottom: 0.45rem;
            border-radius: 8px;
            font-size: 0.85rem;
            border-left: 3px solid #38bdf8;
            gap: 0.5rem;
        }
        .doc-item.empty { border-left-color: #64748b; color: #94a3b8; }
        .doc-item.pendiente { border-left-color: #f59e0b; }
        .doc-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .doc-links { display: flex; gap: 0.3rem; flex-shrink: 0; }
        .open-btn {
            background: #0369a1;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.72rem;
            white-space: nowrap;
        }
        .open-btn:hover { background: #0284c7; }
        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 120px); }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        .message {
            max-width: 85%;
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }
        .user { background: #0369a1; align-self: flex-end; border-bottom-right-radius: 4px; }
        .assistant { background: #334155; align-self: flex-start; border-bottom-left-radius: 4px; }
        .input-area {
            padding: 1rem;
            border-top: 1px solid #334155;
            display: flex;
            gap: 0.7rem;
        }
        #user-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        #user-input:focus { border-color: #38bdf8; }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0.75rem 1.3rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .history-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            font-size: 0.85rem;
        }
        .history-item {
            padding: 0.5rem 0.7rem;
            background: #0f172a;
            margin-bottom: 0.4rem;
            border-radius: 6px;
            cursor: pointer;
            border-left: 3px solid #64748b;
        }
        .history-item:hover { border-left-color: #38bdf8; }
        .clear-btn {
            background: #7f1d1d;
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            margin-top: 0.8rem;
        }

        /* Carga de documentos */
        .chunk-count { margin: 0.3rem 0 0; font-size: 0.8rem; color: #94a3b8; }
        #file-input {
            width: 100%;
            font-size: 0.8rem;
            color: #cbd5e1;
            background: #0f172a;
            border: 1px dashed #475569;
            border-radius: 8px;
            padding: 0.6rem;
            margin-bottom: 0.6rem;
        }
        #file-input::file-selector-button {
            background: #334155;
            color: #e2e8f0;
            border: none;
            border-radius: 6px;
            padding: 0.3rem 0.7rem;
            margin-right: 0.6rem;
            cursor: pointer;
        }
        .upload-btn { width: 100%; padding: 0.6rem 1rem; font-size: 0.85rem; }
        .maint-btn {
            width: 100%;
            background: #78350f;
            font-size: 0.78rem;
            padding: 0.45rem 0.8rem;
            margin-top: 0.8rem;
        }
        .maint-btn:hover { background: #92400e; }
        .upload-msg { margin-top: 0.6rem; font-size: 0.8rem; color: #94a3b8; white-space: pre-wrap; }
        .upload-msg.error { color: #fca5a5; }
        #upload-results { margin-top: 0.7rem; display: flex; flex-direction: column; gap: 0.45rem; }
        .result-card {
            background: #0f172a;
            border-radius: 8px;
            padding: 0.5rem 0.7rem;
            font-size: 0.78rem;
            border-left: 3px solid #64748b;
        }
        .result-card.indexado { border-left-color: #34d399; }
        .result-card.omitido_sin_cambios { border-left-color: #fbbf24; }
        .result-card.error { border-left-color: #f87171; }
        .result-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .result-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .badge { padding: 0.1rem 0.5rem; border-radius: 9999px; font-size: 0.7rem; white-space: nowrap; }
        .badge.indexado { background: #065f46; color: #6ee7b7; }
        .badge.omitido_sin_cambios { background: #78350f; color: #fcd34d; }
        .badge.error { background: #7f1d1d; color: #fca5a5; }
        .result-meta { margin-top: 0.3rem; color: #94a3b8; }
        .result-error { margin-top: 0.3rem; color: #fca5a5; }
        .result-links { margin-top: 0.35rem; display: flex; gap: 0.3rem; flex-wrap: wrap; }
    </style>
</head>
<body>
    <header>
        <div class="logo">Tutor IA · Guía Didáctica RA</div>
        <div class="status">Sistema operativo</div>
    </header>

    <div class="container">
        <!-- Documentos -->
        <aside class="panel panel-docs">
            <h2>Documentos indexados</h2>
            <ul class="doc-list" id="doc-list"></ul>
            <p class="chunk-count">
                Fragmentos indexados: <strong id="chunk-count">…</strong>
            </p>

            <h2 class="sub">Subir documentos</h2>
            <input type="file" id="file-input" multiple accept=".pdf,.docx,.pptx,.txt,.md">
            <button class="upload-btn" id="upload-btn" onclick="subirArchivos()">Subir e indexar</button>
            <div class="upload-msg" id="upload-msg"></div>
            <div id="upload-results"></div>

            <button class="maint-btn" id="reindex-btn" onclick="reindexarTodo()">
                Reindexar todo (mantenimiento)
            </button>
        </aside>

        <!-- Chat -->
        <main class="panel chat-container">
            <h2>Chat de prueba con el Tutor IA</h2>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Escribe tu pregunta sobre normativas..."
                       onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" id="send-btn">Enviar</button>
            </div>
        </main>

        <!-- Historial -->
        <aside class="panel">
            <h2>Historial del chat</h2>
            <ul class="history-list" id="history-list"></ul>
            <button class="clear-btn" onclick="clearHistory()">Limpiar historial</button>
        </aside>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const historyList = document.getElementById('history-list');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('tutor_history') || '[]');
            messagesDiv.innerHTML = '';
            historyList.innerHTML = '';

            history.forEach((msg, index) => {
                addMessage(msg.role, msg.content, false);
                if (msg.role === 'user') {
                    const li = document.createElement('li');
                    li.className = 'history-item';
                    li.textContent = msg.content.substring(0, 45) + (msg.content.length > 45 ? '...' : '');
                    li.onclick = () => {
                        input.value = msg.content;
                        input.focus();
                    };
                    historyList.appendChild(li);
                }
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function saveMessage(role, content) {
            const history = JSON.parse(localStorage.getItem('tutor_history') || '[]');
            history.push({ role, content, timestamp: new Date().toISOString() });
            localStorage.setItem('tutor_history', JSON.stringify(history));
        }

        function addMessage(role, content, save = true) {
            const div = document.createElement('div');
            div.className = `message ${role === 'user' ? 'user' : 'assistant'}`;
            div.textContent = content;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            if (save) saveMessage(role, content);
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = 'Pensando...';

            // Actualizar historial lateral
            const li = document.createElement('li');
            li.className = 'history-item';
            li.textContent = text.substring(0, 45) + (text.length > 45 ? '...' : '');
            historyList.prepend(li);

            try {
                const res = await fetch('/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                addMessage('assistant', data.response || 'Sin respuesta');
            } catch (err) {
                addMessage('assistant', 'Error de conexión con el servidor.');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Enviar';
            }
        }

        function clearHistory() {
            if (confirm('¿Desea borrar todo el historial de chat?')) {
                localStorage.removeItem('tutor_history');
                messagesDiv.innerHTML = '';
                historyList.innerHTML = '';
            }
        }

        // ---------- Documentos: lista, carga e indexado ----------

        const docList = document.getElementById('doc-list');
        const chunkCount = document.getElementById('chunk-count');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const reindexBtn = document.getElementById('reindex-btn');
        const uploadMsg = document.getElementById('upload-msg');
        const uploadResults = document.getElementById('upload-results');

        const ETIQUETAS = {
            indexado: 'indexado',
            omitido_sin_cambios: 'omitido (sin cambios)',
            error: 'error'
        };

        // Crea un elemento con texto seguro (nunca se interpreta como HTML)
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        // ruta tipo "documentacion/pdf/x.pdf" -> enlace servido por /documentacion/pdf/x.pdf
        function enlace(etiqueta, carpeta, archivo) {
            const a = el('a', 'open-btn', etiqueta);
            a.href = '/documentacion/' + carpeta + '/' + encodeURIComponent(archivo);
            a.target = '_blank';
            return a;
        }

        function mensajeError(data, res) {
            const d = data && data.detail;
            return typeof d === 'string' ? d : (d ? JSON.stringify(d) : res.status + ' ' + res.statusText);
        }

        async function cargarDocumentos() {
            try {
                const res = await fetch('/api/v1/documentos');
                const data = await res.json();
                docList.innerHTML = '';
                chunkCount.textContent = data.total_chunks;
                if (!data.documentos.length) {
                    docList.appendChild(el('li', 'doc-item empty', 'No se encontraron documentos'));
                    return;
                }
                data.documentos.forEach(d => {
                    const li = el('li', 'doc-item' + (d.indexado ? '' : ' pendiente'));
                    li.appendChild(el('span', '', '📄 ' + d.nombre));
                    li.title = d.indexado ? d.chunks + ' fragmentos' : 'Aún sin indexar';
                    const links = el('div', 'doc-links');
                    if (d.archivos.pdf) links.appendChild(enlace('PDF', 'pdf', d.archivos.pdf));
                    links.appendChild(enlace('MD', 'markdown', d.archivos.markdown));
                    li.appendChild(links);
                    docList.appendChild(li);
                });
            } catch (err) {
                docList.innerHTML = '';
                docList.appendChild(el('li', 'doc-item empty', 'No se pudo cargar la lista de documentos'));
            }
        }

        function tarjetaResultado(r) {
            const card = el('div', 'result-card ' + r.estado);
            const head = el('div', 'result-head');
            head.appendChild(el('span', 'result-name', r.nombre));
            head.appendChild(el('span', 'badge ' + r.estado, ETIQUETAS[r.estado] || r.estado));
            card.appendChild(head);
            card.appendChild(el('div', 'result-meta', 'Fragmentos indexados: ' + r.chunks_indexados));
            if (r.detalle) card.appendChild(el('div', 'result-error', r.detalle));

            const links = el('div', 'result-links');
            [['Original', 'originales', r.rutas.original],
             ['PDF', 'pdf', r.rutas.pdf],
             ['MD', 'markdown', r.rutas.markdown]].forEach(([etiqueta, carpeta, ruta]) => {
                if (ruta) links.appendChild(enlace(etiqueta, carpeta, ruta.split('/').pop()));
            });
            if (links.childNodes.length) card.appendChild(links);
            return card;
        }

        async function subirArchivos() {
            if (!fileInput.files.length) {
                uploadMsg.className = 'upload-msg error';
                uploadMsg.textContent = 'Selecciona al menos un archivo.';
                return;
            }
            const form = new FormData();
            for (const f of fileInput.files) form.append('archivos', f);

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Convirtiendo e indexando...';
            uploadMsg.className = 'upload-msg';
            uploadMsg.textContent = '';
            uploadResults.innerHTML = '';

            try {
                const res = await fetch('/api/v1/documentos/subir', { method: 'POST', body: form });
                const data = await res.json();
                if (!res.ok) throw new Error(mensajeError(data, res));

                const s = data.resumen;
                uploadMsg.textContent = `${s.total} archivo(s): ${s.indexados} indexado(s), ` +
                    `${s.omitidos_sin_cambios} sin cambios, ${s.errores} con error.`;
                data.resultados.forEach(r => uploadResults.appendChild(tarjetaResultado(r)));
                fileInput.value = '';
                await cargarDocumentos();
            } catch (err) {
                uploadMsg.className = 'upload-msg error';
                uploadMsg.textContent = 'Error al subir: ' + err.message;
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Subir e indexar';
            }
        }

        async function reindexarTodo() {
            if (!confirm('Esto reconstruye por completo la base vectorial desde documentacion/markdown. ¿Continuar?')) return;
            reindexBtn.disabled = true;
            reindexBtn.textContent = 'Reindexando...';
            uploadMsg.className = 'upload-msg';
            uploadMsg.textContent = '';
            uploadResults.innerHTML = '';
            try {
                const res = await fetch('/api/v1/documentos/reindexar', { method: 'POST' });
                const data = await res.json();
                if (!res.ok) throw new Error(mensajeError(data, res));
                uploadMsg.textContent = `Base reconstruida: ${data.documentos} documento(s), ` +
                    `${data.chunks} fragmentos (${data.duracion_s} s).`;
                data.resultados.filter(r => r.estado === 'error')
                    .forEach(r => uploadResults.appendChild(tarjetaResultado({ ...r, chunks_indexados: r.chunks, rutas: {} })));
                await cargarDocumentos();
            } catch (err) {
                uploadMsg.className = 'upload-msg error';
                uploadMsg.textContent = 'Error al reindexar: ' + err.message;
            } finally {
                reindexBtn.disabled = false;
                reindexBtn.textContent = 'Reindexar todo (mantenimiento)';
            }
        }

        loadHistory();
        cargarDocumentos();
    </script>
</body>
</html>
