[alembic]
script_location = alembic
prepend_sys_path = .
# La URL real la decide DATABASE_URL (ver alembic/env.py); esta es solo el valor por defecto si alguien
# corre alembic sin el resto de la app (no debería pasar en este proyecto).
sqlalchemy.url = sqlite:///tutor.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
